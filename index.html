<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Singularity</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101114;color:#f4f4f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}
header{padding:18px 22px;border-bottom:1px solid #292a30;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#9b8cff,#55d6be);display:grid;place-items:center;color:#101114;font-weight:900}
main{width:min(850px,100%);margin:0 auto;flex:1;display:flex;flex-direction:column;padding:28px 18px}
h1{font-size:clamp(26px,5vw,38px);margin:8px 0}.sub{color:#a1a1aa;margin:0 0 26px}
#chat{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.msg{padding:14px 16px;border:1px solid #303139;border-radius:16px;max-width:88%;white-space:pre-wrap;line-height:1.55}
.user{align-self:flex-end;background:#282936}.assistant{align-self:flex-start;background:#191a20}
form{display:flex;gap:10px;padding:10px;border:1px solid #393a43;border-radius:18px;background:#191a20}
textarea{flex:1;resize:vertical;min-height:48px;max-height:180px;background:transparent;border:0;color:inherit;font:inherit;outline:0;padding:12px}
button{border:0;border-radius:13px;background:#d9d6ff;color:#171521;font-weight:700;padding:0 20px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.hint{font-size:12px;color:#85858f;text-align:center;margin:10px}
</style></head>
<body>
<header><div class="logo">S</div><strong>Singularity</strong><span style="color:#92929c;font-size:13px">assistente de IA</span></header>
<main><h1>Em que posso ajudar?</h1><p class="sub">Converse com a Singularity, baseada em Cloudflare Workers AI.</p>
<section id="chat" aria-live="polite"><div class="msg assistant">Olá! Sou a Singularity. Como posso ajudar?</div></section>
<form id="form"><textarea id="message" placeholder="Escreva sua mensagem..." required maxlength="12000"></textarea><button id="send">Enviar</button></form><p class="hint">As respostas podem conter erros. Não compartilhe informações pessoais ou senhas.</p></main>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#message'),chat=document.querySelector('#chat'),send=document.querySelector('#send');
const history=[];
function add(text,role){const el=document.createElement('div');el.className='msg '+role;el.textContent=text;chat.append(el);el.scrollIntoView({behavior:'smooth',block:'end'});return el}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;input.value='';add(message,'user');send.disabled=true;const answer=add('Pensando…','assistant');
try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history:history.slice(-12),mode:'Raciocínio',stream:false})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Não foi possível responder.');answer.textContent=data.content;history.push({role:'user',content:message},{role:'assistant',content:data.content});}
catch(err){answer.textContent='Não consegui responder: '+err.message;}
finally{send.disabled=false;input.focus();}
});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
</script></body></html>
